# =============================================================================
# Schema Genius — Laravel API Nginx config
# Used by the `webserver` service in DEVELOPMENT (docker-compose.yml).
# Listens on port 8000, passes PHP requests to the `app` PHP-FPM container.
# =============================================================================

server {
    listen      8000;
    server_name _;

    # Document root is the Laravel public/ directory
    root  /var/www/html/public;
    index index.php index.html;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;

    charset utf-8;
    client_max_body_size 64m;

    # ── Laravel routes ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM passthrough ───────────────────────────────────────────────
    #    `app` is the Docker service name for the PHP-FPM container.
    location ~ \.php$ {
        fastcgi_pass            app:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout    300s;
        include                 fastcgi_params;
        fastcgi_hide_header     X-Powered-By;
    }

    # ── Deny access to hidden files ───────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # ── Static asset caching ──────────────────────────────────────────────
    location ~* \.(ico|css|js|gif|png|jpg|jpeg|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
