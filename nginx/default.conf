# =============================================================================
# Schema Genius — Unified Production Nginx config
# Used by the `frontend` service in PRODUCTION (docker-compose.prod.yml).
# Listens on port 80 and handles three responsibilities:
#
#   1. Serve the compiled React app (static files in /usr/share/nginx/html)
#   2. Proxy Laravel API requests (/api, /sanctum, /broadcasting) to PHP-FPM
#      `app:9000` via FastCGI — Nginx does NOT need the PHP files locally.
#   3. Proxy Reverb WebSocket connections (/app/, /apps/) to `reverb:8080`.
# =============================================================================

server {
    listen      80;
    server_name _;

    # React static files (baked into the production image)
    root  /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    charset utf-8;
    client_max_body_size 64m;

    # ── Reverb WebSocket proxy (/app/, /apps/) ────────────────────────────
    #    Must appear BEFORE the PHP location blocks so WebSocket upgrade
    #    headers are handled correctly (no fastcgi interference).
    location /app/ {
        proxy_pass         http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /apps/ {
        proxy_pass         http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Laravel API via FastCGI ───────────────────────────────────────────
    #    Routes: /api/*, /sanctum/*, /broadcasting/*
    #
    #    SCRIPT_FILENAME always points to Laravel's front-controller
    #    inside the `app` container (not the nginx container).
    #    PHP-FPM reads the PHP file from its OWN filesystem — this is
    #    correct: nginx only passes the filename metadata, not the file.
    location ~ ^/(api|sanctum|broadcasting)(/.*)?$ {
        fastcgi_pass            app:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param           REQUEST_URI     $request_uri;
        fastcgi_param           QUERY_STRING    $query_string;
        fastcgi_param           REQUEST_METHOD  $request_method;
        fastcgi_param           CONTENT_TYPE    $content_type;
        fastcgi_param           CONTENT_LENGTH  $content_length;
        fastcgi_read_timeout    300s;
        include                 fastcgi_params;
        fastcgi_hide_header     X-Powered-By;
    }

    # ── Static asset caching (JS, CSS, fonts, images) ────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── React Router fallback ─────────────────────────────────────────────
    #    Any path that doesn't match a static file or API route is served
    #    as index.html so client-side routing (react-router-dom) works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Deny hidden files ─────────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }
}
